services:
  - type: web
    name: legal-assistant-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: BIGMODEL_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: true